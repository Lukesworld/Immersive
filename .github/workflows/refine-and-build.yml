name: Immersive Refine & Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  refine-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Immersive
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Android SDK Command-Line Tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Build Tools & Platform 35
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-build-tools android-sdk-platform-tools unzip
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Run Project Build Script if Present
        run: |
          if [ -f "build_immersive.sh" ]; then
            chmod +x build_immersive.sh
            bash build_immersive.sh
          elif [ -f "Makefile" ]; then
            make all
          else
            echo "No build_immersive.sh or Makefile at repo root; listing files:"
            ls -la
          fi

      - name: Notify Cloudflare Edge Agent (Optional)
        if: env.CLOUDFLARE_EDGE_WEBHOOK != ''
        env:
          CLOUDFLARE_EDGE_WEBHOOK: ${{ secrets.CLOUDFLARE_EDGE_WEBHOOK }}
        run: |
          curl -fsSL -X POST "$CLOUDFLARE_EDGE_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"ref\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}" || true

      - name: Upload Refined APK / Zip Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersive-refined-artifacts
          path: |
            build/*.apk
            *.apk
            *.zip
          if-no-files-found: ignore
