name: Immersive Refine & Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
  repository_dispatch:
    types: [ ai-refinement-cycle ]

jobs:
  refine-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Immersive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Workspace & Scripts
        run: |
          ls -la
          find . -maxdepth 3 -not -path '*/.*'
          if [ -f "build_immersive.sh" ]; then
            chmod +x build_immersive.sh
            bash build_immersive.sh
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersive-artifacts
          path: |
            build/*.apk
            *.apk
            *.zip
          if-no-files-found: ignore
